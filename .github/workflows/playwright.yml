name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      # Deterministic install from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Browsers are not cached on purpose: Playwright's guidance is that restoring the
      # cache takes about as long as downloading, and OS dependencies must be installed anyway.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # Type-check, lint and format check: fast, so they fail before the slow browser run.
      - name: Static checks
        run: npm run check

      # CI=true (set by GitHub) turns on retries, forbidOnly, the `github` reporter and a fresh
      # server. Credentials come from .env.example; for a real environment, map secrets instead:
      #   env:
      #     BASE_URL: ${{ vars.STAGING_URL }}
      #     TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      #     TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      # `allure run` wraps `playwright test`: it keeps the test exit code and builds the
      # Allure report from this run's results, also when tests fail.
      - name: Run Playwright tests
        run: npm run test:allure

      # The HTML report embeds traces, screenshots and videos of failed tests.
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # A single self-contained index.html: download, unzip and open it in a browser.
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
