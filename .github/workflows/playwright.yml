name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the browsers the config uses (Pixel 7 runs on Chromium), plus their OS libraries.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Type-check
        run: npm run typecheck

      # CI=true is set by GitHub, so the config turns on retries, forbidOnly and a fresh server.
      # No .env is needed: the app and tests fall back to .env.example.
      - name: Run Playwright tests
        run: npm test

      # Upload the HTML report even when tests fail; that's when you need it most.
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
